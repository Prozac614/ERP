<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>当前库存初始化测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .button {
            background-color: #1890ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        .button:hover {
            background-color: #40a9ff;
        }
        .button.success {
            background-color: #52c41a;
        }
        .button.warning {
            background-color: #faad14;
        }
        .button.danger {
            background-color: #ff4d4f;
        }
        .result {
            background-color: #f6f6f6;
            padding: 15px;
            border-radius: 4px;
            margin-top: 10px;
            white-space: pre-wrap;
            font-family: monospace;
            max-height: 400px;
            overflow-y: auto;
        }
        .success {
            background-color: #f6ffed;
            border: 1px solid #b7eb8f;
            color: #389e0d;
        }
        .error {
            background-color: #fff2f0;
            border: 1px solid #ffccc7;
            color: #cf1322;
        }
        .warning {
            background-color: #fffbe6;
            border: 1px solid #ffe58f;
            color: #d48806;
        }
        .progress {
            background-color: #e6f7ff;
            border: 1px solid #91d5ff;
            color: #0050b3;
        }
        h2 {
            color: #1890ff;
            border-bottom: 2px solid #1890ff;
            padding-bottom: 10px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 15px 0;
        }
        .stats-card {
            background: #fafafa;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #d9d9d9;
            text-align: center;
        }
        .stats-number {
            font-size: 24px;
            font-weight: bold;
            color: #1890ff;
        }
        .stats-label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background-color: #1890ff;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <h1>📦 当前库存初始化测试工具</h1>
    
    <!-- 状态检查 -->
    <div class="container">
        <h2>1. 当前库存状态检查</h2>
        <p>检查当前库存表的数据完整性</p>
        
        <button class="button" onclick="checkCurrentStockStatus()">检查状态</button>
        <button class="button" onclick="refreshStatus()">刷新</button>
        
        <div id="statusStats" class="stats-grid" style="display: none;">
            <div class="stats-card">
                <div class="stats-number" id="materialCount">-</div>
                <div class="stats-label">商品数量</div>
            </div>
            <div class="stats-card">
                <div class="stats-number" id="depotCount">-</div>
                <div class="stats-label">仓库数量</div>
            </div>
            <div class="stats-card">
                <div class="stats-number" id="expectedRecords">-</div>
                <div class="stats-label">预期记录数</div>
            </div>
            <div class="stats-card">
                <div class="stats-number" id="actualRecords">-</div>
                <div class="stats-label">实际记录数</div>
            </div>
            <div class="stats-card">
                <div class="stats-number" id="missingRecords">-</div>
                <div class="stats-label">缺失记录数</div>
            </div>
            <div class="stats-card">
                <div class="stats-number" id="completeness">-</div>
                <div class="stats-label">完整度 (%)</div>
            </div>
        </div>
        
        <div class="progress-bar" id="completenessBar" style="display: none;">
            <div class="progress-fill" id="completenessProgress"></div>
        </div>
        
        <div id="statusResult" class="result"></div>
    </div>

    <!-- 库存初始化 -->
    <div class="container">
        <h2>2. 当前库存初始化</h2>
        <p>为所有商品和仓库组合创建当前库存记录</p>
        
        <button class="button warning" onclick="initializeCurrentStock()">开始初始化</button>
        <button class="button" onclick="monitorProgress()" id="monitorBtn" style="display: none;">监控进度</button>
        
        <div id="initProgress" class="progress-bar" style="display: none;">
            <div class="progress-fill" id="initProgressFill"></div>
        </div>
        
        <div id="initResult" class="result"></div>
    </div>

    <!-- 验证测试 -->
    <div class="container">
        <h2>3. 功能验证测试</h2>
        <p>验证初始化后的库存预警功能是否正常</p>
        
        <button class="button success" onclick="testStockWarningAfterInit()">测试库存预警</button>
        <button class="button" onclick="recalculateSafeStock()">重新计算安全库存</button>
        
        <div id="testResult" class="result"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:9999/jshERP-boot';
        let monitoringInterval = null;

        // 检查当前库存状态
        async function checkCurrentStockStatus() {
            const resultDiv = document.getElementById('statusResult');
            const statsDiv = document.getElementById('statusStats');
            const progressBar = document.getElementById('completenessBar');
            
            resultDiv.className = 'result progress';
            resultDiv.textContent = '正在检查当前库存状态...\n';

            try {
                const response = await fetch(`${API_BASE}/materialCurrentStock/checkCurrentStockStatus`);
                const data = await response.json();
                
                if (data.code === 200) {
                    const result = data.data;
                    
                    // 更新统计卡片
                    document.getElementById('materialCount').textContent = result.materialCount;
                    document.getElementById('depotCount').textContent = result.depotCount;
                    document.getElementById('expectedRecords').textContent = result.expectedRecords;
                    document.getElementById('actualRecords').textContent = result.actualRecords;
                    document.getElementById('missingRecords').textContent = result.missingRecords;
                    document.getElementById('completeness').textContent = result.completeness.toFixed(1);
                    
                    // 更新进度条
                    const progressFill = document.getElementById('completenessProgress');
                    progressFill.style.width = result.completeness + '%';
                    
                    // 显示统计信息
                    statsDiv.style.display = 'grid';
                    progressBar.style.display = 'block';
                    
                    // 设置结果样式
                    const statusClass = result.completeness >= 100 ? 'success' : 
                                      result.completeness >= 50 ? 'warning' : 'error';
                    const statusIcon = result.completeness >= 100 ? '✅' : 
                                     result.completeness >= 50 ? '⚠️' : '❌';
                    
                    resultDiv.className = `result ${statusClass}`;
                    resultDiv.textContent = `${statusIcon} 当前库存状态检查完成\n\n` +
                        `商品数量: ${result.materialCount}\n` +
                        `仓库数量: ${result.depotCount}\n` +
                        `预期记录数: ${result.expectedRecords}\n` +
                        `实际记录数: ${result.actualRecords}\n` +
                        `缺失记录数: ${result.missingRecords}\n` +
                        `数据完整度: ${result.completeness.toFixed(1)}%\n\n`;
                    
                    if (result.completeness < 100) {
                        resultDiv.textContent += '建议执行库存初始化来补全缺失的记录。';
                    } else {
                        resultDiv.textContent += '当前库存数据完整，可以正常使用库存预警功能。';
                    }
                    
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = `❌ 检查失败: ${data.data}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `❌ 请求异常: ${error.message}`;
            }
        }

        // 刷新状态
        function refreshStatus() {
            checkCurrentStockStatus();
        }

        // 初始化当前库存
        async function initializeCurrentStock() {
            if (!confirm('初始化当前库存可能需要较长时间，确定要继续吗？')) {
                return;
            }
            
            const resultDiv = document.getElementById('initResult');
            const progressBar = document.getElementById('initProgress');
            const progressFill = document.getElementById('initProgressFill');
            const monitorBtn = document.getElementById('monitorBtn');
            
            resultDiv.className = 'result progress';
            resultDiv.textContent = '正在初始化当前库存数据，请稍候...\n';
            progressBar.style.display = 'block';
            progressFill.style.width = '0%';

            try {
                const response = await fetch(`${API_BASE}/materialCurrentStock/initializeCurrentStock`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const data = await response.json();
                
                if (data.code === 200) {
                    const result = data.data;
                    const successRate = result.totalCount > 0 ? (result.successCount / result.totalCount * 100) : 0;
                    
                    progressFill.style.width = '100%';
                    
                    const statusClass = result.failedCount === 0 ? 'success' : 'warning';
                    const statusIcon = result.failedCount === 0 ? '✅' : '⚠️';
                    
                    resultDiv.className = `result ${statusClass}`;
                    resultDiv.textContent = `${statusIcon} 当前库存初始化完成！\n\n` +
                        `总记录数: ${result.totalCount}\n` +
                        `成功数量: ${result.successCount}\n` +
                        `失败数量: ${result.failedCount}\n` +
                        `新建记录: ${result.createdCount}\n` +
                        `更新记录: ${result.updatedCount}\n` +
                        `商品数量: ${result.materialCount}\n` +
                        `仓库数量: ${result.depotCount}\n` +
                        `成功率: ${successRate.toFixed(1)}%\n\n` +
                        `${result.message}`;
                    
                    if (result.failedCount === 0) {
                        resultDiv.textContent += '\n\n🎉 所有记录初始化成功！现在可以测试库存预警功能。';
                    } else {
                        resultDiv.textContent += `\n\n⚠️ 有 ${result.failedCount} 条记录初始化失败，请检查日志。`;
                    }
                    
                    // 自动刷新状态
                    setTimeout(checkCurrentStockStatus, 1000);
                    
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = `❌ 初始化失败: ${data.data}`;
                    progressFill.style.width = '0%';
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `❌ 请求异常: ${error.message}`;
                progressFill.style.width = '0%';
            }
        }

        // 测试库存预警功能
        async function testStockWarningAfterInit() {
            const resultDiv = document.getElementById('testResult');
            resultDiv.className = 'result progress';
            resultDiv.textContent = '正在测试库存预警功能...\n';

            try {
                // 1. 检查库存预警报表
                resultDiv.textContent += '1. 检查库存预警报表...\n';
                const warningResponse = await fetch(`${API_BASE}/depotItem/findStockWarningCount?currentPage=1&pageSize=5&materialParam=`);
                const warningData = await warningResponse.json();
                
                if (warningData.code === 200) {
                    const total = warningData.data.total || 0;
                    resultDiv.textContent += `   ✅ 预警报表查询成功，发现 ${total} 个预警商品\n`;
                    
                    if (total > 0) {
                        resultDiv.textContent += '   预警商品示例:\n';
                        warningData.data.rows.slice(0, 3).forEach((item, index) => {
                            resultDiv.textContent += `   ${index + 1}. ${item.mname || '未知商品'} - 当前库存: ${item.currentNumber || 0}\n`;
                        });
                    }
                } else {
                    resultDiv.textContent += `   ❌ 预警报表查询失败: ${warningData.data}\n`;
                }
                
                // 2. 检查当前库存状态
                resultDiv.textContent += '\n2. 重新检查当前库存状态...\n';
                const statusResponse = await fetch(`${API_BASE}/materialCurrentStock/checkCurrentStockStatus`);
                const statusData = await statusResponse.json();
                
                if (statusData.code === 200) {
                    const status = statusData.data;
                    resultDiv.textContent += `   ✅ 当前库存完整度: ${status.completeness.toFixed(1)}%\n`;
                    resultDiv.textContent += `   实际记录数: ${status.actualRecords} / ${status.expectedRecords}\n`;
                } else {
                    resultDiv.textContent += `   ❌ 状态检查失败: ${statusData.data}\n`;
                }
                
                resultDiv.className = 'result success';
                resultDiv.textContent += '\n🎉 库存预警功能测试完成！\n';
                resultDiv.textContent += '\n如果预警商品数量为0，这可能是正常情况（所有商品库存都在安全范围内）。\n';
                resultDiv.textContent += '如果需要看到预警数据，可以：\n';
                resultDiv.textContent += '1. 设置商品的安全库存阈值\n';
                resultDiv.textContent += '2. 调整某些商品的当前库存使其超出安全范围\n';
                resultDiv.textContent += '3. 重新计算安全库存';
                
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent += `\n❌ 测试异常: ${error.message}`;
            }
        }

        // 重新计算安全库存
        async function recalculateSafeStock() {
            const resultDiv = document.getElementById('testResult');
            resultDiv.className = 'result progress';
            resultDiv.textContent = '正在重新计算安全库存...\n';

            try {
                const response = await fetch(`${API_BASE}/stockWarning/startCalculation`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                
                const data = await response.json();
                
                if (data.code === 200) {
                    const taskId = data.data.taskId;
                    resultDiv.textContent += `✅ 安全库存计算任务已启动，任务ID: ${taskId}\n`;
                    resultDiv.textContent += '正在监控计算进度...\n';
                    
                    // 监控任务进度
                    await monitorCalculationTask(taskId, resultDiv);
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = `❌ 启动计算失败: ${data.data}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `❌ 计算异常: ${error.message}`;
            }
        }

        // 监控计算任务进度
        async function monitorCalculationTask(taskId, resultDiv) {
            for (let i = 0; i < 60; i++) { // 最多等待60秒
                try {
                    const response = await fetch(`${API_BASE}/stockWarning/getTaskStatus?taskId=${taskId}`);
                    const data = await response.json();
                    
                    if (data.code === 200) {
                        const status = data.data;
                        resultDiv.textContent += `进度: ${status.processedCount || 0}/${status.totalCount || 0} (${status.status})\n`;
                        
                        if (status.status === 'COMPLETED') {
                            resultDiv.className = 'result success';
                            resultDiv.textContent += `✅ 安全库存计算完成！成功: ${status.successCount}, 失败: ${status.failedCount}\n`;
                            resultDiv.textContent += '\n现在可以重新测试库存预警功能。';
                            return;
                        } else if (status.status === 'FAILED') {
                            resultDiv.className = 'result error';
                            resultDiv.textContent += `❌ 计算失败: ${status.errorMessage || '未知错误'}\n`;
                            return;
                        }
                    }
                } catch (error) {
                    resultDiv.className = 'result error';
                    resultDiv.textContent += `❌ 监控异常: ${error.message}\n`;
                    return;
                }
                
                await new Promise(resolve => setTimeout(resolve, 1000));
            }
            
            resultDiv.className = 'result warning';
            resultDiv.textContent += '⚠️ 计算超时，请手动检查任务状态\n';
        }

        // 页面加载完成后自动检查状态
        window.onload = function() {
            console.log('当前库存初始化测试工具已加载');
            checkCurrentStockStatus();
        };
    </script>
</body>
</html>
