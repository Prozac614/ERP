<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>库存预警计算测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        button {
            background-color: #1890ff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background-color: #40a9ff;
        }

        .result {
            background-color: #f6f6f6;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            white-space: pre-wrap;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        .input-group {
            margin: 10px 0;
        }

        .input-group label {
            display: inline-block;
            width: 100px;
            font-weight: bold;
        }

        .input-group input {
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 3px;
        }
    </style>
</head>

<body>
    <h1>库存预警计算测试工具</h1>

    <div class="test-section">
        <h3>1. 测试单个商品计算</h3>
        <div class="input-group">
            <label>商品ID:</label>
            <input type="number" id="materialIdInput" placeholder="输入商品ID" value="1">
            <button onclick="testSingleCalculation()">测试计算</button>
        </div>
        <div id="singleTestResult" class="result"></div>
    </div>

    <div class="test-section">
        <h3>2. 启动完整计算任务</h3>
        <button onclick="startFullCalculation()">启动完整计算</button>
        <div id="fullCalculationResult" class="result"></div>
    </div>

    <div class="test-section">
        <h3>3. 查看库存预警报表</h3>
        <button onclick="viewStockWarningReport()">查看预警报表</button>
        <div id="reportResult" class="result"></div>
    </div>

    <script>
        const API_BASE = '/jshERP-boot'; // 根据实际部署调整

        // 测试单个商品计算
        async function testSingleCalculation() {
            const materialId = document.getElementById('materialIdInput').value;
            const resultDiv = document.getElementById('singleTestResult');

            if (!materialId) {
                resultDiv.textContent = '请输入商品ID';
                return;
            }

            resultDiv.textContent = '正在测试计算...';

            try {
                const response = await fetch(`${API_BASE}/stockWarning/testCalculation?materialId=${materialId}`);
                const data = await response.json();

                if (data.code === 200) {
                    displayCalculationResult(data.data, resultDiv);
                } else {
                    resultDiv.textContent = '测试失败: ' + data.data;
                }
            } catch (error) {
                resultDiv.textContent = '请求失败: ' + error.message;
            }
        }

        // 显示计算结果
        function displayCalculationResult(data, container) {
            let html = `
                <h4>计算结果</h4>
                <p><strong>商品ID:</strong> ${data.materialId}</p>
                <p><strong>商品名称:</strong> ${data.materialName}</p>
                <p><strong>商品编码:</strong> ${data.barCode || '无'}</p>
                <p><strong>平均日销量:</strong> ${data.averageDailySales}</p>
                <p><strong>建议最低安全库存:</strong> ${data.calculatedLowSafeStock}</p>
                <p><strong>计算时间:</strong> ${new Date(data.calculationTime).toLocaleString()}</p>
                
                <h4>当前各仓库安全库存设置</h4>
                <table>
                    <thead>
                        <tr>
                            <th>仓库ID</th>
                            <th>仓库名称</th>
                            <th>当前最低安全库存</th>
                            <th>当前最高安全库存</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            data.currentSafeStockSettings.forEach(setting => {
                html += `
                    <tr>
                        <td>${setting.depotId}</td>
                        <td>${setting.depotName}</td>
                        <td>${setting.currentLowSafeStock || '未设置'}</td>
                        <td>${setting.currentHighSafeStock || '未设置'}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
                <p><strong>总仓库数:</strong> ${data.depotCount}</p>
            `;

            container.innerHTML = html;
        }

        // 启动完整计算
        async function startFullCalculation() {
            const resultDiv = document.getElementById('fullCalculationResult');
            resultDiv.textContent = '正在启动完整计算任务...';

            try {
                const response = await fetch(`${API_BASE}/stockWarning/startCalculation`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({})
                });

                const data = await response.json();

                if (data.code === 200) {
                    resultDiv.textContent = `计算任务已启动，任务ID: ${data.data.taskId}\n\n请到前端界面查看进度，或使用之前的API测试工具查询任务状态。`;
                } else {
                    resultDiv.textContent = '启动失败: ' + data.data;
                }
            } catch (error) {
                resultDiv.textContent = '请求失败: ' + error.message;
            }
        }

        // 查看库存预警报表
        async function viewStockWarningReport() {
            const resultDiv = document.getElementById('reportResult');
            resultDiv.textContent = '正在获取库存预警报表...';

            try {
                const response = await fetch(`${API_BASE}/depotItem/findStockWarningCount?currentPage=1&pageSize=10&materialParam=`);
                const data = await response.json();

                if (data.code === 200) {
                    displayWarningReport(data.data, resultDiv);
                } else {
                    resultDiv.textContent = '获取报表失败: ' + data.data;
                }
            } catch (error) {
                resultDiv.textContent = '请求失败: ' + error.message;
            }
        }

        // 显示预警报表
        function displayWarningReport(data, container) {
            if (!data.rows || data.rows.length === 0) {
                container.textContent = '暂无库存预警数据';
                return;
            }

            let html = `
                <h4>库存预警报表 (总计: ${data.total} 条)</h4>
                <table>
                    <thead>
                        <tr>
                            <th>商品编码</th>
                            <th>商品名称</th>
                            <th>仓库</th>
                            <th>当前库存</th>
                            <th>最低安全库存</th>
                            <th>最高安全库存</th>
                            <th>建议入库量</th>
                            <th>建议出库量</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            data.rows.forEach(row => {
                html += `
                    <tr>
                        <td>${row.barCode || '无'}</td>
                        <td>${row.materialName || '无'}</td>
                        <td>${row.depotName || '无'}</td>
                        <td>${row.currentNumber || 0}</td>
                        <td>${row.lowSafeStock || '未设置'}</td>
                        <td>${row.highSafeStock || '未设置'}</td>
                        <td>${row.lowCritical || 0}</td>
                        <td>${row.highCritical || 0}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            container.innerHTML = html;
        }
    </script>
</body>

</html>
